# Omi Audio Capture Webhook Receiver (CC-PROMPT-101).
#
# Standalone container on the existing `coolify` docker network. Traefik
# (coolify-proxy) routes omi-audio.moxiemesh.com -> this container via the
# dynamic config at /data/coolify/proxy/dynamic/omi-audio-moxiemesh.yaml.
# TLS is terminated by Traefik (Let's Encrypt), so the app speaks plain HTTP.
#
# Host audio folder /opt/omi-audio/data is bind-mounted to /data in the
# container. Files land at /data/{uid}/{YYYY-MM-DD}/{unix_ts_ms}.wav.
#
# Secrets live in .env on the VPS (NOT committed). Deploy by editing files in
# /opt/omi-audio then `sudo docker compose up -d --build`.

services:
  omi-audio:
    build: .
    image: omi-audio:latest
    container_name: omi-audio
    restart: unless-stopped
    networks:
      - coolify
    volumes:
      - /opt/omi-audio/data:/data
    environment:
      - PORT=8080
      - AUDIO_DIR=/data
      - CAPTURE_TOKEN=${CAPTURE_TOKEN}
      - OMI_ALLOWED_UIDS=${OMI_ALLOWED_UIDS:-}
    # Run as the host's `omar` uid (1001) so captured WAVs on the bind mount
    # are owned by omar and directly accessible without sudo. Pre-chown
    # /opt/omi-audio/data to 1001:1001.
    user: "1001:1001"
    healthcheck:
      # alpine ships busybox wget. App binds 0.0.0.0 (IPv4); use 127.0.0.1
      # explicitly to avoid the IPv6-only `localhost` resolution trap.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # CC-PROMPT-104 — compaction sidecar. Compacts WAV -> Opus on a timed sweep
  # (~10x smaller) and, when enabled, prunes old files. Runs separately from
  # the receiver so an ffmpeg fault can never touch the verified webhook hot
  # path. NOT on the `coolify` network (no public surface); it only shares the
  # ./data volume. Receiver service above is byte-for-byte unchanged.
  omi-audio-compactor:
    build: ./compactor
    container_name: omi-audio-compactor
    restart: unless-stopped
    user: "1001:1001"
    volumes:
      - /opt/omi-audio/data:/data
    environment:
      - DATA_DIR=/data
      - OPUS_BITRATE=24k
      - MIN_AGE_MIN=2
      - SWEEP_INTERVAL_SEC=300
      - RETENTION_DAYS=0

networks:
  coolify:
    external: true
